<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A page opened from a personal link: the link never leaves as a referrer, and nothing indexes it. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Book a time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      /* Mirrors `--dash-plane`, so the first frame is not a white flash. */
      body { background: #eceae4; }
      @media (prefers-color-scheme: dark) { body { background: #0e1013; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/public/main.tsx"></script>
  </body>
</html>
